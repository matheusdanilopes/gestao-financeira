# Typecheck, lint e testes do app a cada push e pull request.
# Os testes do Fin usam um Gemini simulado e um Supabase em memória:
# não precisam de segredo nem gastam cota. As avaliações com o modelo
# real (npm run evals) rodam à parte — ver scripts/evals/README.md.
name: Qualidade

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint lib/ai lib/categorizacao lib/categorizarTransacoes.ts lib/ragClassificacao.ts lib/graficoChat.ts lib/useChatFinanceiro.ts components/chat app/api/chat app/api/categorizar app/api/classificar app/api/nubank/importar app/chat scripts
      - run: npm test
